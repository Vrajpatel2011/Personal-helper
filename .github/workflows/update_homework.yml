name: Update homework

on:
  schedule:
    # Every 30 minutes from 6:00 AM through 10:00 PM UTC
    - cron: "*/30 6-21 * * *"
    - cron: "0 22 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests icalendar

      - name: Fetch assignments
        env:
          SCHOOLOGY_URL: ${{ secrets.SCHOOLOGY_URL }}
        run: python fetch_homework.py

      - name: Commit and push assignments.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assignments.json
          if git diff --staged --quiet; then
            echo "No assignment changes to commit."
            exit 0
          fi
          git commit -m "Update assignments from the Schoology calendar"
          git push
